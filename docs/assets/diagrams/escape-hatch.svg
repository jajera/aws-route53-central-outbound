<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img"
     aria-labelledby="title desc"
     font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="title">Escape hatch: central shared rule plus a critical account local outbound</title>
  <desc id="desc">Most accounts use only the RAM-shared corp.demo.internal rule through the hub outbound. A critical account also has a local outbound and a more specific payments.corp.demo.internal rule. That name uses the local ENIs; other names on the same VPC still use the shared hub rule.</desc>
  <defs>
    <marker id="eh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/>
    </marker>
    <marker id="eh-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087443"/>
    </marker>
    <marker id="eh-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4FFF"/>
    </marker>
  </defs>
  <style>
    .eh-panel { fill: #f6f7f9; stroke: #d0d5dd; stroke-width: 1.5; }
    .eh-title { font-size: 16px; font-weight: 700; fill: #101828; }
    .eh-meta  { font-size: 11.5px; font-weight: 500; fill: #667085; font-family: IBM Plex Mono, ui-monospace, monospace; }
    .eh-label { font-size: 12px; font-weight: 600; fill: #344054; }
    .eh-box   { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; }
    .eh-hub   { fill: #f4f0ff; stroke: #8C4FFF; stroke-width: 1.5; }
    .eh-local { fill: #ecfdf3; stroke: #087443; stroke-width: 1.75; }
    .eh-dns   { fill: #ffffff; stroke: #ED7100; stroke-width: 1.75; }
    .eh-ok    { font-size: 11px; font-weight: 700; fill: #087443; }
    .eh-foot  { font-size: 12.5px; font-weight: 600; fill: #344054; }
    .eh-line  { stroke: #475467; stroke-width: 1.5; fill: none; marker-end: url(#eh-arrow); }
    .eh-ram   { stroke: #8C4FFF; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#eh-arrow-purple); }
    .eh-esc   { stroke: #087443; stroke-width: 1.75; fill: none; marker-end: url(#eh-arrow-green); }
  </style>

  <rect class="eh-panel" x="16" y="16" width="448" height="328" rx="12"/>
  <text class="eh-title" x="40" y="48">Most accounts</text>
  <text class="eh-meta" x="40" y="68">Shared hub only</text>

  <rect class="eh-box" x="130" y="88" width="100" height="48" rx="8"/>
  <text class="eh-label" x="180" y="110" text-anchor="middle">Spoke A</text>
  <text class="eh-meta" x="180" y="126" text-anchor="middle">no local ENIs</text>

  <rect class="eh-box" x="250" y="88" width="100" height="48" rx="8"/>
  <text class="eh-label" x="300" y="110" text-anchor="middle">Spoke B</text>
  <text class="eh-meta" x="300" y="126" text-anchor="middle">no local ENIs</text>

  <path class="eh-ram" d="M 180 136 V 168 L 220 184"/>
  <path class="eh-ram" d="M 300 136 V 168 L 260 184"/>
  <rect fill="#f6f7f9" x="202" y="148" width="76" height="16" rx="2"/>
  <text class="eh-meta" x="240" y="160" text-anchor="middle">RAM rule</text>

  <rect class="eh-hub" x="140" y="184" width="200" height="56" rx="8"/>
  <text class="eh-label" x="240" y="208" text-anchor="middle">Hub outbound</text>
  <text class="eh-meta" x="240" y="226" text-anchor="middle">corp.demo.internal</text>

  <path class="eh-line" d="M 240 240 V 268"/>

  <rect class="eh-dns" x="160" y="268" width="160" height="36" rx="8"/>
  <text class="eh-label" x="240" y="290" text-anchor="middle">Corporate DNS</text>

  <text class="eh-foot" x="40" y="330">All names share the hub fate.</text>

  <rect class="eh-panel" x="496" y="16" width="448" height="328" rx="12"/>
  <text class="eh-title" x="520" y="48">Critical account</text>
  <text class="eh-meta" x="520" y="68">Shared hub + local escape hatch</text>

  <rect class="eh-box" x="620" y="84" width="200" height="48" rx="8"/>
  <text class="eh-label" x="720" y="106" text-anchor="middle">Critical VPC</text>
  <text class="eh-meta" x="720" y="122" text-anchor="middle">two rules associated</text>

  <path class="eh-esc" d="M 680 132 V 156 L 600 176"/>
  <rect class="eh-local" x="520" y="176" width="160" height="64" rx="8"/>
  <text class="eh-label" x="600" y="198" text-anchor="middle">Local outbound</text>
  <text class="eh-ok" x="600" y="216" text-anchor="middle">payments.corp...</text>
  <text class="eh-meta" x="600" y="232" text-anchor="middle">more specific</text>

  <path class="eh-esc" d="M 600 240 L 680 268"/>
  <text class="eh-ok" x="568" y="258">escape</text>

  <path class="eh-ram" d="M 760 132 V 156 L 840 176"/>
  <rect class="eh-hub" x="760" y="176" width="160" height="64" rx="8"/>
  <text class="eh-label" x="840" y="198" text-anchor="middle">Hub (RAM)</text>
  <text class="eh-meta" x="840" y="216" text-anchor="middle">corp.demo.internal</text>
  <text class="eh-meta" x="840" y="232" text-anchor="middle">broader names</text>

  <path class="eh-ram" d="M 840 240 L 760 268"/>

  <rect class="eh-dns" x="640" y="268" width="160" height="36" rx="8"/>
  <text class="eh-label" x="720" y="290" text-anchor="middle">Corporate DNS</text>

  <text class="eh-foot" x="520" y="330">payments.* bypasses the hub; rest still use it.</text>
</svg>
