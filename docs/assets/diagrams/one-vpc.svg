  <title id="title">One VPC: per-account vs central Route 53 Resolver outbound</title>
  <desc id="desc">Left: one VPC with its own outbound endpoint (two ENIs) to corporate DNS. Right: the same VPC uses a RAM-shared rule to a hub outbound endpoint (two ENIs) — same cost, extra RAM and rule parts.</desc>
