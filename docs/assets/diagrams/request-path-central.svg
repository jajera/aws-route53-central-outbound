<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 226" width="100%" role="img"
     aria-labelledby="title desc"
     font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="title">Central request path</title>
  <desc id="desc">A spoke test client query goes to the VPC Resolver, matches one of two RAM-shared FORWARD rules (forward corp.demo.internal or reverse 100.0.10.in-addr.arpa), forwards through the hub outbound ENIs in the network account, and reaches BIND serving both zones at 10.0.0.10. Both rules use the same pair of ENIs. No VPC peering is needed for resolution.</desc>
