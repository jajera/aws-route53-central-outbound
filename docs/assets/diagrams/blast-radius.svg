<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img"
     aria-labelledby="title desc"
     font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="title">Blast radius: per-account isolates a failure; central shared hub affects all spokes</title>
  <desc id="desc">Left: each VPC has its own outbound endpoint. When VPC 2 outbound fails, VPC 1 and VPC 3 keep resolving. Right: all spokes share one hub endpoint; when that hub fails, every associated spoke loses resolution for the shared zones.</desc>
  <defs>
    <marker id="br-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/>
    </marker>
    <marker id="br-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d92d20"/>
    </marker>
  </defs>
  <style>
    .br-panel { fill: #f6f7f9; stroke: #d0d5dd; stroke-width: 1.5; }
    .br-title { font-size: 16px; font-weight: 700; fill: #101828; }
    .br-meta  { font-size: 12px; font-weight: 500; fill: #667085; font-family: IBM Plex Mono, ui-monospace, monospace; }
    .br-label { font-size: 12px; font-weight: 600; fill: #344054; }
    .br-ok    { fill: #ecfdf3; stroke: #087443; stroke-width: 1.5; }
    .br-bad   { fill: #fef3f2; stroke: #d92d20; stroke-width: 1.75; }
    .br-hub   { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; }
    .br-hub-bad { fill: #fef3f2; stroke: #d92d20; stroke-width: 1.75; }
    .br-ok-t  { font-size: 11px; font-weight: 700; fill: #087443; }
    .br-bad-t { font-size: 11px; font-weight: 700; fill: #d92d20; }
    .br-foot  { font-size: 13px; font-weight: 600; fill: #344054; }
    .br-line  { stroke: #475467; stroke-width: 1.5; fill: none; marker-end: url(#br-arrow); }
    .br-line-bad { stroke: #d92d20; stroke-width: 1.75; fill: none; marker-end: url(#br-arrow-bad); stroke-dasharray: 4 3; }
  </style>

  <rect class="br-panel" x="16" y="16" width="448" height="288" rx="12"/>
  <text class="br-title" x="40" y="48">Per-account</text>
  <text class="br-meta" x="40" y="68">Failure stays in one account</text>

  <rect class="br-ok" x="40" y="92" width="120" height="64" rx="8"/>
  <text class="br-label" x="100" y="118" text-anchor="middle">VPC 1</text>
  <text class="br-ok-t" x="100" y="138" text-anchor="middle">OK</text>

  <rect class="br-bad" x="180" y="92" width="120" height="64" rx="8"/>
  <text class="br-label" x="240" y="118" text-anchor="middle">VPC 2</text>
  <text class="br-bad-t" x="240" y="138" text-anchor="middle">outbound X</text>

  <rect class="br-ok" x="320" y="92" width="120" height="64" rx="8"/>
  <text class="br-label" x="380" y="118" text-anchor="middle">VPC 3</text>
  <text class="br-ok-t" x="380" y="138" text-anchor="middle">OK</text>

  <path class="br-line" d="M 100 156 V 190"/>
  <path class="br-line-bad" d="M 240 156 V 190"/>
  <path class="br-line" d="M 380 156 V 190"/>

  <rect class="br-hub" x="40" y="190" width="120" height="44" rx="8"/>
  <text class="br-label" x="100" y="217" text-anchor="middle">own ENIs</text>
  <rect class="br-hub-bad" x="180" y="190" width="120" height="44" rx="8"/>
  <text class="br-bad-t" x="240" y="217" text-anchor="middle">own ENIs X</text>
  <rect class="br-hub" x="320" y="190" width="120" height="44" rx="8"/>
  <text class="br-label" x="380" y="217" text-anchor="middle">own ENIs</text>

  <text class="br-foot" x="40" y="268">VPC 1 and 3 still resolve.</text>
  <text class="br-meta" x="40" y="288">Blast radius = one account</text>

  <rect class="br-panel" x="496" y="16" width="448" height="288" rx="12"/>
  <text class="br-title" x="520" y="48">Central</text>
  <text class="br-meta" x="520" y="68">One hub - shared fate</text>

  <rect class="br-bad" x="520" y="92" width="100" height="56" rx="8"/>
  <text class="br-label" x="570" y="116" text-anchor="middle">Spoke 1</text>
  <text class="br-bad-t" x="570" y="134" text-anchor="middle">down</text>

  <rect class="br-bad" x="640" y="92" width="100" height="56" rx="8"/>
  <text class="br-label" x="690" y="116" text-anchor="middle">Spoke 2</text>
  <text class="br-bad-t" x="690" y="134" text-anchor="middle">down</text>

  <rect class="br-bad" x="760" y="92" width="100" height="56" rx="8"/>
  <text class="br-label" x="810" y="116" text-anchor="middle">Spoke 3</text>
  <text class="br-bad-t" x="810" y="134" text-anchor="middle">down</text>

  <path class="br-line-bad" d="M 570 148 V 168 L 650 190"/>
  <path class="br-line-bad" d="M 690 148 V 190"/>
  <path class="br-line-bad" d="M 810 148 V 168 L 750 190"/>

  <rect class="br-hub-bad" x="600" y="190" width="200" height="52" rx="8"/>
  <text class="br-label" x="700" y="214" text-anchor="middle">Hub outbound</text>
  <text class="br-bad-t" x="700" y="232" text-anchor="middle">shared ENIs X</text>

  <text class="br-foot" x="520" y="268">All associated spokes lose the zone.</text>
  <text class="br-meta" x="520" y="288">Blast radius = every consumer</text>
</svg>
